baseURL = "https://vandanbhuva.github.io/"
languageCode = "en-us"
title = "Vandan Bhuva"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[params]
  # Shown on the home page and in <meta> tags.
  description = "Security engineer focused on application and software security. MS Information Security at Carnegie Mellon University."
  tagline = "Security engineer · Application & software security"
  prompt = "vandan@cmu:~$"
  # PLACEHOLDER: fill these in. Leave a value empty ("") to hide that link.
  email = ""
  github = "https://github.com/VandanBhuva"
  linkedin = ""
  resume = ""   # e.g. "/resume.pdf" once you drop the PDF into /static

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  style = "dracula"
  noClasses = true

[menus]
  [[menus.main]]
    name = "about"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "experience"
    pageRef = "/experience"
    weight = 2
  [[menus.main]]
    name = "projects"
    pageRef = "/projects"
    weight = 3
  [[menus.main]]
    name = "writeups"
    pageRef = "/writeups"
    weight = 4
  [[menus.main]]
    name = "blog"
    pageRef = "/blog"
    weight = 5
  [[menus.main]]
    name = "resume"
    pageRef = "/resume"
    weight = 6
  [[menus.main]]
    name = "contact"
    pageRef = "/contact"
    weight = 7
