<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ "/" | relURL }}"><span class="accent">&gt;</span> vandan<span class="cursor" aria-hidden="true">_</span></a>
    <nav aria-label="Main">
      <ul>
      {{ $current := . }}
      {{ range site.Menus.main }}
        {{ $active := false }}
        {{ with .Page }}
          {{ if .IsHome }}{{ $active = $current.IsHome }}
          {{ else }}{{ $active = or (eq $current .) (in $current.Ancestors .) }}{{ end }}
        {{ end }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{ end }}
      </ul>
    </nav>
  </div>
</header>
